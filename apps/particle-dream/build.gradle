plugins { id 'com.android.application' }

android {
    namespace 'ru.krajcik.tvlab.particles'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'ru.krajcik.tvlab.particles'
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'ru.krajcik.tvlab.particles.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
